[project]
name = "orgwarrior-mcp"
version = "0.1.0"
description = "A porcelain for Org's agenda, for Claude: an MCP server over orgwarrior's engine and your running Emacs"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["org-mode", "emacs", "agenda", "mcp", "claude", "tasks"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Editors :: Emacs",
]
dependencies = [
    "mcp==2.3.0",
    "orgwarrior @ git+https://github.com/aleksozolins/orgwarrior",
    "orgwarrior-web @ git+https://github.com/aleksozolins/orgwarrior-web",
]

[project.urls]
Homepage = "https://github.com/aleksozolins/orgwarrior-mcp"
Issues = "https://github.com/aleksozolins/orgwarrior-mcp/issues"

[project.scripts]
orgwarrior-mcp = "orgwarrior_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license as SPDX (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

# From GitHub for an install from GitHub (uv tool install --no-sources);
# from the checkouts beside this one for development, so the tests use
# orgwarrior's fixtures and both packages' own code.
[tool.uv.sources]
orgwarrior = { path = "../orgwarrior", editable = true }
orgwarrior-web = { path = "../orgwarrior-web", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
