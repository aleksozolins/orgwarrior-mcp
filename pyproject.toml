[project]
name = "orgwarrior-mcp"
version = "0.3.1"
description = "A porcelain for Org's agenda, for Claude: an MCP server over orgwarrior's engine and your running Emacs"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aleks Ozolins", email = "aleks@ozolins.xyz" }]
keywords = ["org-mode", "emacs", "agenda", "mcp", "claude", "tasks"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Editors :: Emacs",
]
dependencies = [
    "mcp==2.3.0",
    "orgwarrior>=0.4.2",
    "orgwarrior-web>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/aleksozolins/orgwarrior-mcp"
Issues = "https://github.com/aleksozolins/orgwarrior-mcp/issues"

[project.scripts]
orgwarrior-mcp = "orgwarrior_mcp.server:main"
# Its dependencies' commands too: one install gives all three, one copy of the engine.
orgwarrior = "orgwarrior.cli:main"
orgwarrior-web = "orgwarrior_web.server:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license as SPDX (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

# From the checkouts beside this one for development, so the tests use
# orgwarrior's fixtures and both packages' own code; a published package
# carries none of this.
[tool.uv.sources]
orgwarrior = { path = "../orgwarrior", editable = true }
orgwarrior-web = { path = "../orgwarrior-web", editable = true }

# CLAUDE.md is notes for working on the code, CLAUDE.local.md the maintainer's own.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "CLAUDE.local.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
