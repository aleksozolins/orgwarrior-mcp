# Every tool against a throwaway Emacs, the oldest supported and the newest.
# orgwarrior and orgwarrior-web are checked out beside this one, as for
# development.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "31.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: orgwarrior-mcp
      - uses: actions/checkout@v4
        with:
          repository: aleksozolins/orgwarrior
          path: orgwarrior
      - uses: actions/checkout@v4
        with:
          repository: aleksozolins/orgwarrior-web
          path: orgwarrior-web
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
        working-directory: orgwarrior-mcp
